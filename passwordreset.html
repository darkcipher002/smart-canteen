<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen System - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-animate {
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 via-gray-50 to-orange-100 bg-animate font-sans text-gray-900">

    <div class="w-full max-w-md bg-white/80 backdrop-blur-xl border border-white shadow-2xl rounded-3xl p-10 m-4 relative overflow-hidden">

        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-400 to-orange-600"></div>

        <div class="flex justify-center mb-8">
            <div class="p-3 bg-orange-100 rounded-2xl shadow-inner">
                <svg class="w-10 h-10 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
        </div>

        <!-- STEP 1: Request reset link -->
        <div id="request-view">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold tracking-tight text-gray-900">Reset your password</h2>
                <p class="text-sm text-gray-500 mt-2">Enter the email linked to your account and we'll send you a link to reset your password.</p>
            </div>

            <form id="reset-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3.5 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white outline-none transition-all duration-200 shadow-sm"
                        placeholder="hello@neighborhood.com">
                </div>

                <button type="submit" id="submit-btn" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transform transition hover:-translate-y-0.5">
                    Send Reset Link
                </button>
            </form>

            <div id="error-message" class="mt-4 p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-red-600 text-center hidden"></div>
        </div>

        <!-- STEP 2: Confirmation -->
        <div id="success-view" class="hidden text-center">
            <div class="flex justify-center mb-6">
                <div class="p-4 bg-green-100 rounded-full">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Check your inbox</h2>
            <p class="text-sm text-gray-600 mb-6">
                If an account exists for <span id="sent-email" class="font-semibold text-gray-800"></span>,
                a password reset link is on its way. It may take a minute to arrive — don't forget to check spam.
            </p>
            <button id="resend-btn" class="text-sm font-semibold text-orange-500 hover:text-orange-600 transition">
                Didn't get it? Send again
            </button>
        </div>

        <p class="mt-8 text-center text-sm text-gray-600">
            Remembered your password?
            <a href="login.html" class="font-bold text-orange-500 hover:text-orange-600 transition">Back to login</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpwR1fxkEMTkpcVIQtkzcu91Ce-VJ2pYs",
            authDomain: "mark-kenya.firebaseapp.com",
            projectId: "mark-kenya",
            storageBucket: "mark-kenya.firebasestorage.app",
            messagingSenderId: "205623271753",
            appId: "1:205623271753:web:8b3e8f46bfc0784f577a98"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const requestView = document.getElementById('request-view');
        const successView = document.getElementById('success-view');
        const resetForm = document.getElementById('reset-form');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const emailInput = document.getElementById('email');
        const sentEmailLabel = document.getElementById('sent-email');
        const resendBtn = document.getElementById('resend-btn');

        async function handleReset(email) {
            errorMessage.classList.add('hidden');
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Sending...
            `;

            try {
                await sendPasswordResetEmail(auth, email);
                sentEmailLabel.textContent = email;
                requestView.classList.add('hidden');
                successView.classList.remove('hidden');
            } catch (error) {
                console.error(error.code, error.message);

                // Note: for privacy, Firebase (and best practice) is to avoid
                // revealing whether an email exists. We only surface genuine
                // input/network errors, not "user not found".
                if (error.code === 'auth/invalid-email') {
                    errorMessage.textContent = "Please enter a valid email address.";
                    errorMessage.classList.remove('hidden');
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage.textContent = "Too many requests. Please wait a moment and try again.";
                    errorMessage.classList.remove('hidden');
                } else if (error.code === 'auth/user-not-found') {
                    // Still show success view to avoid leaking account existence
                    sentEmailLabel.textContent = email;
                    requestView.classList.add('hidden');
                    successView.classList.remove('hidden');
                } else {
                    errorMessage.textContent = "Something went wrong. Please try again.";
                    errorMessage.classList.remove('hidden');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        }

        resetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;
            handleReset(email);
        });

        resendBtn.addEventListener('click', () => {
            const email = sentEmailLabel.textContent;
            if (email) handleReset(email);
        });
    </script>
</body>
</html>
